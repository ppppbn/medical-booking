name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  AWS_REGION: ap-southeast-1

jobs:
  terraform:
    name: 'Terraform Infrastructure'
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      ec2_ip: ${{ steps.tf_output.outputs.instance_ip }}
    defaults:
      run:
        working-directory: ./terraform/aws

    steps:
    - uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_wrapper: false

    - name: Ensure S3 Bucket Exists
      run: |
        BUCKET_NAME="medbooking-tfstate-$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')-${{ env.AWS_REGION }}"
        echo "Checking if bucket $BUCKET_NAME exists..."
        if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
          echo "Bucket does not exist. Creating..."
          aws s3api create-bucket --bucket "$BUCKET_NAME" --region ${{ env.AWS_REGION }} --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }}
          # Enable versioning for terraform state
          aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled
        fi
        echo "TF_BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV

    - name: Terraform Init
      run: |
        terraform init \
          -backend-config="bucket=${{ env.TF_BUCKET_NAME }}" \
          -backend-config="key=medical-booking/terraform.tfstate" \
          -backend-config="region=${{ env.AWS_REGION }}"

    - name: Terraform Apply
      run: terraform apply -auto-approve -var="key_name=${{ secrets.AWS_KEY_PAIR_NAME }}"

    - name: Get EC2 IP
      id: tf_output
      run: |
        IP=$(terraform output -raw instance_public_ip)
        echo "instance_ip=$IP" >> $GITHUB_OUTPUT

  build-and-push:
    name: 'Build and Push Docker Images'
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Backend
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: ghcr.io/${{ github.repository }}/backend:latest

    - name: Build and push Frontend
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: ghcr.io/${{ github.repository }}/frontend:latest

  deploy:
    name: 'Deploy to EC2'
    needs: [terraform, build-and-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3

    - name: Copy docker-compose.prod.yml to EC2
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ needs.terraform.outputs.ec2_ip }}
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "docker-compose.prod.yml"
        target: "~/"

    - name: Run Docker Compose on EC2
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ needs.terraform.outputs.ec2_ip }}
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Wait for cloud-init (user_data) to finish installing docker
          while [ ! -f /var/lib/cloud/instance/boot-finished ]; do
            echo 'Waiting for cloud-init...'
            sleep 5
          done
          
          # Force OS to recognize the new 30GB disk size (Terraform expanded the EBS volume, but OS needs to resize filesystem)
          sudo growpart /dev/nvme0n1 1 || true
          sudo resize2fs /dev/nvme0n1p1 || true
          sudo growpart /dev/xvda 1 || true
          sudo resize2fs /dev/xvda1 || true
          
          # Clean up any dangling/failed Docker images that might be taking up space
          docker system prune -a -f
          
          
          # Log into GHCR
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Create .env file for Docker Compose
          cat << EOF > .env
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=7d
          PORT=3000
          NODE_ENV=production
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          EMAIL_PASS=${{ secrets.EMAIL_PASS }}
          VNP_TMNCODE=${{ secrets.VNP_TMNCODE }}
          VNP_HASHSECRET=${{ secrets.VNP_HASHSECRET }}
          VNP_URL=${{ secrets.VNP_URL }}
          VNP_RETURNURL=${{ secrets.VNP_RETURNURL }}
          REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
          GITHUB_REPOSITORY=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          EOF
          
          # Pull and start services
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
