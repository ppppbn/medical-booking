name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  AWS_REGION: ap-southeast-1

jobs:
  terraform:
    name: 'Terraform Infrastructure'
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      ec2_ip: ${{ steps.tf_output.outputs.instance_ip }}
      instance_id: ${{ steps.tf_output.outputs.instance_id }}
    defaults:
      run:
        working-directory: ./terraform/aws

    steps:
    - uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_wrapper: false

    - name: Ensure S3 Bucket Exists
      run: |
        BUCKET_NAME="medbooking-tfstate-$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')-${{ env.AWS_REGION }}"
        echo "Checking if bucket $BUCKET_NAME exists..."
        if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
          echo "Bucket does not exist. Creating..."
          aws s3api create-bucket --bucket "$BUCKET_NAME" --region ${{ env.AWS_REGION }} --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }}
          # Enable versioning for terraform state
          aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled
        fi
        echo "TF_BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV

    - name: Terraform Init
      run: |
        terraform init \
          -backend-config="bucket=${{ env.TF_BUCKET_NAME }}" \
          -backend-config="key=medical-booking/terraform.tfstate" \
          -backend-config="region=${{ env.AWS_REGION }}"

    - name: Terraform Apply
      run: terraform apply -auto-approve -var="key_name=${{ secrets.AWS_KEY_PAIR_NAME }}"

    - name: Get EC2 IP & ID
      id: tf_output
      run: |
        IP=$(terraform output -raw instance_public_ip)
        INSTANCE_ID=$(terraform output -raw instance_id)
        echo "instance_ip=$IP" >> $GITHUB_OUTPUT
        echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

  build-and-push:
    name: 'Build and Push Docker Images'
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Backend
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: ghcr.io/${{ github.repository }}/backend:latest

    - name: Build and push Frontend
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: ghcr.io/${{ github.repository }}/frontend:latest

  deploy:
    name: 'Deploy to EC2 via SSM'
    needs: [terraform, build-and-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Prepare Files for Deployment
      id: prep
      run: |
        # Encode docker-compose
        COMPOSE_B64=$(cat docker-compose.prod.yml | base64 -w 0)
        echo "compose_b64=$COMPOSE_B64" >> $GITHUB_OUTPUT
        
        # Build .env and encode
        cat << 'ENVEOF' > .env
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        JWT_SECRET=${{ secrets.JWT_SECRET }}
        JWT_EXPIRES_IN=7d
        PORT=3000
        NODE_ENV=production
        FRONTEND_URL=${{ secrets.FRONTEND_URL }}
        EMAIL_USER=${{ secrets.EMAIL_USER }}
        EMAIL_PASS=${{ secrets.EMAIL_PASS }}
        VNP_TMNCODE=${{ secrets.VNP_TMNCODE }}
        VNP_HASHSECRET=${{ secrets.VNP_HASHSECRET }}
        VNP_URL=${{ secrets.VNP_URL }}
        VNP_RETURNURL=${{ secrets.VNP_RETURNURL }}
        REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
        ENVEOF
        
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "GITHUB_REPOSITORY=$REPO_LOWER" >> .env
        
        ENV_B64=$(cat .env | base64 -w 0)
        echo "env_b64=$ENV_B64" >> $GITHUB_OUTPUT

    - name: Execute Deployment via AWS SSM
      run: |
        INSTANCE_ID="${{ needs.terraform.outputs.instance_id }}"
        echo "Waiting for SSM Agent on instance $INSTANCE_ID..."
        
        # Poll until SSM agent is online
        MAX_WAIT=30
        COUNT=0
        while true; do
          STATUS=$(aws ssm describe-instance-information --instance-information-filter-list key=InstanceIds,valueSet=$INSTANCE_ID --query "InstanceInformationList[0].PingStatus" --output text)
          if [ "$STATUS" == "Online" ]; then
            echo "SSM Agent is online!"
            break
          fi
          if [ $COUNT -ge $MAX_WAIT ]; then
            echo "Timeout waiting for SSM agent"
            exit 1
          fi
          echo "Current status: $STATUS. Retrying in 5s..."
          sleep 5
          ((COUNT++))
        done
        
        echo "Sending deployment command..."
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters '{
            "commands": [
              "#!/bin/bash",
              "set -e",
              "cd /home/ubuntu",
              "while [ ! -f /var/lib/cloud/instance/boot-finished ]; do sleep 5; done",
              "sudo growpart /dev/nvme0n1 1 || true",
              "sudo resize2fs /dev/nvme0n1p1 || true",
              "sudo growpart /dev/xvda 1 || true",
              "sudo resize2fs /dev/xvda1 || true",
              "docker system prune -a -f",
              "echo \"${{ steps.prep.outputs.compose_b64 }}\" | base64 -d > docker-compose.prod.yml",
              "echo \"${{ steps.prep.outputs.env_b64 }}\" | base64 -d > .env",
              "echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin",
              "docker compose -f docker-compose.prod.yml pull",
              "docker compose -f docker-compose.prod.yml up -d"
            ]
          }' \
          --timeout-seconds 600 \
          --output text \
          --query "Command.CommandId")
        
        echo "Command ID: $COMMAND_ID"
        echo "Waiting for command to complete..."
        aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
        
        # Fetch output
        echo "--- STDOUT ---"
        aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
        
        echo "--- STDERR ---"
        aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text
        
        STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
        if [ "$STATUS" != "Success" ]; then
          echo "Deployment failed with status $STATUS"
          exit 1
        fi
