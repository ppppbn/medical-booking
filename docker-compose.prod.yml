version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: medbooking_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-superStrongP@ssw0rd}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: always

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:latest
    container_name: medbooking_backend
    environment:
      - DATABASE_URL=sqlserver://db:1433;database=med_booking;user=sa;password=${DB_PASSWORD:-superStrongP@ssw0rd};encrypt=true;trustServerCertificate=true
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_medbooking}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-production}
      - FRONTEND_URL=${FRONTEND_URL:-https://mybuildspace.tech}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - VNP_TMNCODE=${VNP_TMNCODE}
      - VNP_HASHSECRET=${VNP_HASHSECRET}
      - VNP_URL=${VNP_URL}
      - VNP_RETURNURL=${VNP_RETURNURL}
    depends_on:
      - db
    restart: always
    env_file: .env

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:latest
    container_name: medbooking_frontend
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-https://mybuildspace.tech/api}
    depends_on:
      - backend
    restart: always
    env_file: .env

  caddy:
    image: caddy:2-alpine
    container_name: medbooking_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  sqlserver_data:
  caddy_data:
  caddy_config:
